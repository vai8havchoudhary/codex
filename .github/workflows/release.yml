name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify tag and manifest version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("plugins/cliproxy-models/.codex-plugin/plugin.json").read_text()
          )
          version = manifest["version"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit(f"manifest version is not stable semver: {version!r}")
          expected_tag = f"v{version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match manifest {expected_tag!r}"
              )
          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{version}] - " not in changelog:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Validate repository and plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s plugins/cliproxy-models/scripts -p 'test_*.py' -v
          python3 -m compileall -q plugins/cliproxy-models/scripts tests
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/cliproxy-models/.codex-plugin/plugin.json >/dev/null
          git diff --check

      - name: Build release archive
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="cliproxy-models-${VERSION}/" \
            --output="dist/cliproxy-models-${VERSION}.zip" \
            HEAD \
            .agents/plugins/marketplace.json \
            plugins/cliproxy-models \
            README.md \
            SETUP.md \
            CHANGELOG.md \
            LICENSE \
            PRIVACY.md \
            SECURITY.md \
            TERMS.md
          (
            cd dist
            sha256sum "cliproxy-models-${VERSION}.zip" \
              > "cliproxy-models-${VERSION}.zip.sha256"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: cliproxy-models-${{ steps.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "CLIProxyAPI Models $GITHUB_REF_NAME"
          fi
