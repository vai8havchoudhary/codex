name: release

on:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify release ref and manifest version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("plugins/cliproxy-models/.codex-plugin/plugin.json").read_text()
          )
          version = manifest["version"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit(f"manifest version is not stable semver: {version!r}")

          expected_tag = f"v{version}"
          ref_type = os.environ["GITHUB_REF_TYPE"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          if ref_type == "tag":
              if ref_name != expected_tag:
                  raise SystemExit(
                      f"release tag {ref_name!r} does not match manifest {expected_tag!r}"
                  )
          elif ref_type == "branch":
              expected_branch = f"release/{expected_tag}"
              if ref_name != expected_branch:
                  raise SystemExit(
                      f"release branch {ref_name!r} does not match {expected_branch!r}"
                  )
          else:
              raise SystemExit(f"unsupported release ref type: {ref_type!r}")

          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{version}] - " not in changelog:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={expected_tag}\n")
          PY

      - name: Require promotion branch to equal current main
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$release_sha" != "$main_sha" ]]; then
            echo "release branch must point to current main: release=$release_sha main=$main_sha" >&2
            exit 1
          fi

      - name: Validate repository and plugin
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s plugins/cliproxy-models/scripts -p 'test_*.py' -v
          python3 -m compileall -q plugins/cliproxy-models/scripts tests
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/cliproxy-models/.codex-plugin/plugin.json >/dev/null
          git diff --check

      - name: Create or verify annotated release tag
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "existing tag $TAG points to $tag_sha, expected $GITHUB_SHA" >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "CLIProxyAPI Models $TAG"
            git push origin "refs/tags/$TAG"
          else
            echo "tag-triggered release is missing its own tag $TAG" >&2
            exit 1
          fi

      - name: Build release archive
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="cliproxy-models-${VERSION}/" \
            --output="dist/cliproxy-models-${VERSION}.zip" \
            HEAD \
            .agents/plugins/marketplace.json \
            plugins/cliproxy-models \
            README.md \
            SETUP.md \
            CHANGELOG.md \
            LICENSE \
            PRIVACY.md \
            SECURITY.md \
            TERMS.md
          (
            cd dist
            sha256sum "cliproxy-models-${VERSION}.zip" \
              > "cliproxy-models-${VERSION}.zip.sha256"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: cliproxy-models-${{ steps.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "CLIProxyAPI Models $TAG"
          fi
