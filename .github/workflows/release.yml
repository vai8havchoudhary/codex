name: release

on:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify release ref, marketplace, and plugin versions
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          release = json.loads(Path("release.json").read_text())
          version = release["version"]
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit(f"release version is not stable semver: {version!r}")
          expected_tag = f"v{version}"
          ref_type = os.environ["GITHUB_REF_TYPE"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          if ref_type == "tag":
              if ref_name != expected_tag:
                  raise SystemExit(
                      f"release tag {ref_name!r} does not match release metadata {expected_tag!r}"
                  )
          elif ref_type == "branch":
              expected_branch = f"release/{expected_tag}"
              if ref_name != expected_branch:
                  raise SystemExit(
                      f"release branch {ref_name!r} does not match {expected_branch!r}"
                  )
          else:
              raise SystemExit(f"unsupported release ref type: {ref_type!r}")

          marketplace = json.loads(Path(".agents/plugins/marketplace.json").read_text())
          entries = {entry["name"] for entry in marketplace["plugins"]}
          mapped = release.get("plugins")
          if not isinstance(mapped, dict) or set(mapped) != entries:
              raise SystemExit(
                  f"release plugin map {sorted(mapped or {})} does not match marketplace {sorted(entries)}"
              )
          for name, expected_version in sorted(mapped.items()):
              manifest_path = Path("plugins") / name / ".codex-plugin" / "plugin.json"
              manifest = json.loads(manifest_path.read_text())
              if manifest.get("name") != name:
                  raise SystemExit(f"manifest name mismatch for {name}: {manifest.get('name')!r}")
              if manifest.get("version") != expected_version:
                  raise SystemExit(
                      f"manifest version mismatch for {name}: "
                      f"{manifest.get('version')!r} != {expected_version!r}"
                  )

          changelog = Path("CHANGELOG.md").read_text()
          if f"## [{version}] - " not in changelog:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={expected_tag}\n")
              output.write(f"archive={release['name']}-{version}\n")
          PY

      - name: Require promotion branch to equal current main
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$release_sha" != "$main_sha" ]]; then
            echo "release branch must point to current main: release=$release_sha main=$main_sha" >&2
            exit 1
          fi

      - name: Validate repository and plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          for suite in plugins/*/scripts; do
            if compgen -G "$suite/test_*.py" >/dev/null; then
              python3 -m unittest discover -s "$suite" -p 'test_*.py' -v
            fi
          done
          python3 -m compileall -q plugins tests
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool release.json >/dev/null
          for manifest in plugins/*/.codex-plugin/plugin.json; do
            python3 -m json.tool "$manifest" >/dev/null
          done
          git diff --check

      - name: Create or verify annotated release tag
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "existing tag $TAG points to $tag_sha, expected $GITHUB_SHA" >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "CLIProxyAPI Plugins $TAG"
            git push origin "refs/tags/$TAG"
          else
            echo "tag-triggered release is missing its own tag $TAG" >&2
            exit 1
          fi

      - name: Build release archive
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="${ARCHIVE}/" \
            --output="dist/${ARCHIVE}.zip" \
            HEAD \
            .agents/plugins/marketplace.json \
            plugins \
            release.json \
            README.md \
            SETUP.md \
            CHANGELOG.md \
            LICENSE \
            PRIVACY.md \
            SECURITY.md \
            TERMS.md
          (
            cd dist
            sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.archive }}
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "CLIProxyAPI Plugins $TAG"
          fi
